packages:
  - 'drives-policy'
  - 'drives-server'
  - 'drives-ui'
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  deasync: true
  protobufjs: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.5 || 2.11.10'
  - '@turbo/darwin-arm64@2.10.5 || 2.11.10'
  - '@turbo/linux-64@2.10.5 || 2.11.10'
  - '@turbo/linux-arm64@2.10.5 || 2.11.10'
  - '@turbo/windows-64@2.10.5 || 2.11.10'
  - '@turbo/windows-arm64@2.10.5 || 2.11.10'
  - turbo@2.10.5 || 2.11.10
