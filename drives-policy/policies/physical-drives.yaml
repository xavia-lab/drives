apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "physical-drives"
  rules:
    # 1. Admin can ALWAYS create, show, and list
    - actions:
        [
          "create",
          "show",
          "list",
          "edit",
          "delete",
          "locate",
          "acquire",
          "relocate",
          "manage-media",
        ]
      effect: EFFECT_ALLOW
      roles:
        - admin

    # 2. Viewer
    - actions: ["show", "list", "acquire", "relocate", "manage-media"]
      effect: EFFECT_ALLOW
      roles:
        - user

    - actions: ["show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - viewer
