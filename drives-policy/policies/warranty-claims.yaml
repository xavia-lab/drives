apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "warranty-claims"
  rules:
    # 1. Admin can manage claim headers and open new claims.
    - actions: ["create", "show", "list", "edit", "delete", "initiate"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    # 2. Viewer is read-only
    - actions: ["show", "list", "initiate"]
      effect: EFFECT_ALLOW
      roles:
        - user

    - actions: ["show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - viewer
