apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "drive-lifecycle-events"
  rules:
    # 1. Admin may read and append lifecycle events. The ledger is append-only,
    #    so there is deliberately no edit/delete action.
    - actions: ["create", "show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    # 2. Viewer is read-only
    - actions: ["show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - user
        - viewer
