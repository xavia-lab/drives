apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "virtual-servers"
  rules:
    # 1. Admin can ALWAYS create, show, and list
    - actions: ["create", "show", "list", "edit", "delete"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    # 2. Viewer
    - actions: ["show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - owner
        - viewer
