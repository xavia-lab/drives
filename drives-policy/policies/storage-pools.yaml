apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "storage-pools"
  rules:
    # 1. Admin can ALWAYS create, show, list, and attach/detach pools
    - actions:
        ["create", "show", "list", "edit", "delete", "import", "export"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    # 2. Viewer
    - actions: ["show", "list"]
      effect: EFFECT_ALLOW
      roles:
        - owner
        - viewer
