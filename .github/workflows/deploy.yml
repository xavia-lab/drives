name: Production Docker Compilation Pipeline

on:
  push:
    branches:
      - master # 🚀 Fires context checks exclusively on deployment merges

# 🔐 Grant permissions to write container artifacts directly into your repository package panel
permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Run Quality Sweeps and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.14.0

      - name: Cache pnpm Store Volumes
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Bind Monorepo Dependency Workspace Maps
        run: pnpm install --frozen-lockfile

      # 🚀 Split tasks to filter out the frontend lint run without skipping any test specs
      - name: Run Workspace Linting (Excluding UI)
        run: pnpm turbo run lint --filter='!@drives/drives-ui'

      - name: Run Global Test Suite Verification
        run: pnpm turbo run test

      - name: Set up Docker Buildx Engines
        uses: docker/setup-buildx-action@v4

      # 🔐 Native Zero-Secret authentication against GitHub's Container Registry
      - name: Authenticate Session against GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🐋 COMPILING AND PUSHING THE CERBOS AUTHORIZATION POLICY REGISTRY
      - name: Compile and Push Security Authorization Engine
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-policy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/drives-policy:latest
            ghcr.io/${{ github.repository }}/drives-policy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🐋 COMPILING AND PUSHING THE BACKEND API SERVER
      - name: Compile and Push Backend Drive Server Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/drives-server:latest
            ghcr.io/${{ github.repository }}/drives-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🐋 COMPILING AND PUSHING THE FRONTEND USER INTERFACE
      - name: Compile and Push Frontend UI Application Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/drives-ui:latest
            ghcr.io/${{ github.repository }}/drives-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
