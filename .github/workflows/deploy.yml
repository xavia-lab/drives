name: Production Docker Compilation Pipeline

on:
  push:
    branches:
      - master # 🚀 Fires context checks exclusively on deployment merges
    tags:
      - 'v*' # 🚀 Triggers build when semantic version tags are pushed (e.g., v1.1.1)

# 🔐 Grant permissions to write container artifacts directly into your repository package panel
permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm64
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.14.0

      - name: Cache pnpm Store Volumes
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Bind Monorepo Dependency Workspace Maps
        run: pnpm install --frozen-lockfile

      # 🚀 Split tasks to filter out the frontend lint run without skipping any test specs
      - name: Run Workspace Linting (Excluding UI)
        run: pnpm turbo run lint --filter='!@drives/drives-ui'

      - name: Run Global Test Suite Verification
        run: pnpm turbo run test

      - name: Set up Docker Buildx Engines
        uses: docker/setup-buildx-action@v4

      # 🔐 Native Zero-Secret authentication against GitHub's Container Registry
      - name: Authenticate Session against GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🐋 COMPILING AND PUSHING SINGLE ARCHITECTURE IMAGES
      - name: Compile and Push Security Authorization Engine (Arch Suffix)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-policy/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}/drives-policy:${{ github.sha }}-${{ matrix.suffix }}
          provenance: false
          cache-from: type=gha,scope=policy-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=policy-${{ matrix.platform }}

      - name: Compile and Push Backend Drive Server Image (Arch Suffix)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-server/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}/drives-server:${{ github.sha }}-${{ matrix.suffix }}
          provenance: false
          cache-from: type=gha,scope=server-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.platform }}

      - name: Compile and Push Frontend UI Application Image (Arch Suffix)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./drives-ui/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}/drives-ui:${{ github.sha }}-${{ matrix.suffix }}
          provenance: false
          cache-from: type=gha,scope=ui-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.platform }}

  merge-manifests:
    name: Merge Multi-Arch Manifests
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx Engines
        uses: docker/setup-buildx-action@v4

      - name: Authenticate Session against GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🏷️ GENERATE AUTHORITATIVE GLOBAL TARGET LABELS (v1, v1.1, v1.1.1, latest)
      - name: Extract Metadata for Policy Registry
        id: meta-policy
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drives-policy
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=true
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract Metadata for Backend Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drives-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=true
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract Metadata for Frontend UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/drives-ui
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=true
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # 🔗 CREATE AND PUSH MULTI-ARCH MANIFEST MAPS
      - name: Finalize Multi-Arch Manifest for Policy Registry
        run: |
          echo "${{ steps.meta-policy.outputs.tags }}" | xargs -I {} docker buildx imagetools create -t {} \
            ghcr.io/${{ github.repository }}/drives-policy:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository }}/drives-policy:${{ github.sha }}-arm64

      - name: Finalize Multi-Arch Manifest for Backend Server
        run: |
          echo "${{ steps.meta-server.outputs.tags }}" | xargs -I {} docker buildx imagetools create -t {} \
            ghcr.io/${{ github.repository }}/drives-server:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository }}/drives-server:${{ github.sha }}-arm64

      - name: Finalize Multi-Arch Manifest for Frontend UI
        run: |
          echo "${{ steps.meta-ui.outputs.tags }}" | xargs -I {} docker buildx imagetools create -t {} \
            ghcr.io/${{ github.repository }}/drives-ui:${{ github.sha }}-amd64 \
            ghcr.io/${{ github.repository }}/drives-ui:${{ github.sha }}-arm64
